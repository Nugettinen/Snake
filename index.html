<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>
    <button id="restartButton">Restart Game</button>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const info = document.getElementById("info");
        let gameOver = false;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        info.textContent = "Score: " + score;
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================


        const moveSnake = () => {
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y };
            if (head.x < 0 || 
                head.x >= tileCount || 
                head.y < 0 || 
                head.y >= tileCount) {
                    clearInterval(gameInterval);
                    gameOver = true;
                    alert("Game Over! Your score: " + score);
                    return;
            }
            for (const segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    clearInterval(gameInterval);
                    gameOver = true;
                    alert("Game Over! Your score: " + score);
                    return;
                }
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                info.textContent = "Score: " + score;
                placeFood();
            } else {
                snake.pop();
            }
        };

        const placeFood = () => {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => 
                                segment.x === newFood.x && 
                                segment.y === newFood.y
            ));
            food = newFood;
        };
        
        window.addEventListener("keydown", (e) => {
            if (gameOver) {
                return;
            }
            if (e.key === "ArrowUp" && direction.y === 0) {
                direction = { x: 0, y: -1 };
            } else if (e.key === "ArrowDown" && direction.y === 0) {
                direction = { x: 0, y: 1 };
            } else if (e.key === "ArrowLeft" && direction.x === 0) {
                direction = { x: -1, y: 0 };
            } else if (e.key === "ArrowRight" && direction.x === 0) {
                direction = { x: 1, y: 0 };
            }
        });
        document.getElementById("restartButton").addEventListener("click", () => {
            gameOver = false;
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }];
            direction = { x: 1, y: 0 };
            score = 0;
            info.textContent = "Score: " + score;
            placeFood();
            drawGame();
            gameInterval = setInterval(() => {
                moveSnake();
                drawGame();
            }, 300);
        });
        gameInterval = setInterval(() => {
            moveSnake();
            drawGame();
        }, 300);
        
    </script>

</body>
</html>
