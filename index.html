<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Snake Game</title>
</head>
<body>

    <h1>Snake-game</h1>
    <p id="scor"></p>
    <canvas id="gameCanvas" width="300"
            height="300"></canvas>
    <p id="info"></p>
    <button id="restartButton">Restart Game</button>

    <script>
        // ===== GAME SETUP =====
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 10;
        const tileCount = canvas.width / gridSize;
        const scor = document.getElementById("scor");
        const info = document.getElementById("info");
        let gameOver = false;
        let nextDirection = { x: 1, y: 0 };
        let directionLocked = false;
        let gameInterval;
        let gameSpeed = 300;


        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        scor.textContent = "Score: " + score;
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================

        const startGame = () => {
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                moveSnake();
                drawGame();
            }, gameSpeed);
        };

        const moveSnake = () => {
            direction = nextDirection;
            directionLocked = false;
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y };
            if (head.x < 0 || 
                head.x >= tileCount || 
                head.y < 0 || 
                head.y >= tileCount) {
                    clearInterval(gameInterval);
                    gameOver = true;
                    info.textContent = "Game Over! Your score: " + score;
                    return;
            }
            for (const segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    clearInterval(gameInterval);
                    gameOver = true;
                    info.textContent = "Game Over! Your score: " + score;
                    return;
                }
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                scor.textContent = "Score: " + score;
                gameSpeed -= 20;
                if (gameSpeed < 80) {
                    gameSpeed = 80;
                }
                placeFood();
                startGame();
            } else {
                snake.pop();
            }
        };

        const placeFood = () => {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => 
                                segment.x === newFood.x && 
                                segment.y === newFood.y
            ));
            food = newFood;
        };
        
        window.addEventListener("keydown", (e) => {
            if (gameOver || directionLocked) {
                return;
            }
            if (e.key === "ArrowUp" && direction.y === 0) {
                nextDirection = { x: 0, y: -1 };
                directionLocked = true;
            } else if (e.key === "ArrowDown" && direction.y === 0) {
                nextDirection = { x: 0, y: 1 };
                directionLocked = true;
            } else if (e.key === "ArrowLeft" && direction.x === 0) {
                nextDirection = { x: -1, y: 0 };
                directionLocked = true;
            } else if (e.key === "ArrowRight" && direction.x === 0) {
                nextDirection = { x: 1, y: 0 };
                directionLocked = true;
            }
        });
        document.getElementById("restartButton").addEventListener("click", () => {
            gameOver = false;
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }];
            direction = { x: 1, y: 0 };
            score = 0;
            scor.textContent = "Score: " + score;
            info.textContent = "";
            nextDirection = { x: 1, y: 0 };
            directionLocked = false;
            gameSpeed = 300;
            placeFood();
            drawGame();
            startGame();
        });

        startGame();
    
    </script>

</body>
</html>
